name: Feature proposal
description: Propose a user or operational capability
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational need without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Acceptance outcome
      description: What observable behavior would solve the problem?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Include permissions, privacy, migration, legacy, accessibility, scale, and rollback concerns.
  - type: textarea
    id: rollout
    attributes:
      label: Rollout and evidence
      description: Suggested feature flag, canary population, metrics, and validation.
